<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Drift</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06010f;--pk:#ff2e88;--cy:#18e0ff;--yl:#ffe66d;--tx:#f5eaff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Orbitron',system-ui,sans-serif;color:var(--tx);touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;filter:saturate(1.25) contrast(1.06)}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0}
.b small,#spd small{display:block;font-size:11px;letter-spacing:.15em;color:var(--cy);opacity:.9}
.b b{font-size:clamp(26px,5vw,44px);text-shadow:0 0 14px var(--pk)}
.b:last-child{text-align:right}
#spd{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:150px}
#spd b{font-size:clamp(34px,6vw,56px);text-shadow:0 0 16px var(--cy)}
.bar{height:8px;border:1px solid var(--cy);border-radius:4px;margin:6px 0 3px;overflow:hidden}
#nit{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cy),#fff);box-shadow:0 0 10px var(--cy)}
#toast{position:fixed;top:26%;left:0;right:0;text-align:center;font-weight:900;font-size:clamp(20px,4vw,38px);color:var(--yl);text-shadow:0 0 18px var(--pk);opacity:0;transition:opacity .4s;pointer-events:none}
.ov{overflow-y:auto;touch-action:pan-y;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(6,1,15,.3),rgba(6,1,15,.88))}
h1{font-size:clamp(44px,11vw,120px);font-weight:900;font-style:italic;letter-spacing:.05em;line-height:.95;background:linear-gradient(180deg,#fff27a,var(--pk) 55%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,46,136,.6))}
.ov p{max-width:46ch;line-height:1.6;font-weight:500;color:#d9c8f5}
.go{font:900 18px 'Orbitron',system-ui,sans-serif;letter-spacing:.12em;color:#06010f;background:linear-gradient(90deg,var(--yl),var(--pk));border:0;border-radius:40px;padding:16px 40px;cursor:pointer;box-shadow:0 0 28px rgba(255,46,136,.7);transition:transform .15s}
.go:hover,.go:focus-visible{transform:scale(1.06);outline:2px solid #fff}
.keys{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;font-size:12px;color:var(--cy)}
kbd{font:inherit;border:1px solid var(--cy);border-radius:5px;padding:3px 8px;margin-right:6px;box-shadow:0 0 8px rgba(24,224,255,.4)}
.stat{font-size:clamp(22px,4vw,34px);font-weight:900;color:var(--yl);text-shadow:0 0 14px var(--pk)}
#nbtn{display:none;position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:84px;height:84px;border-radius:50%;border:2px solid var(--cy);background:rgba(24,224,255,.15);color:var(--cy);font:900 12px 'Orbitron',system-ui,sans-serif;box-shadow:0 0 18px var(--cy)}
@media(pointer:coarse){#nbtn{display:block}}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:11px;color:var(--cy)}
.row button{font:700 11px 'Orbitron',system-ui,sans-serif;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid rgba(24,224,255,.45);border-radius:8px;padding:8px 12px;cursor:pointer}
.row button.on{background:var(--cy);color:#06010f;box-shadow:0 0 14px var(--cy)}
.row button:focus-visible{outline:2px solid #fff}
.hide{display:none!important}
body.m #hud,body.m #spd,body.m #nbtn{display:none}
@media(prefers-reduced-motion:reduce){.go{transition:none}}
</style></head><body class="m">
<canvas id="c"></canvas><div class="scan"></div>
<div id="hud"><div class="b"><small id="tl">TIME</small><b id="t">60</b></div><div class="b" style="text-align:center"><small id="ml">LAP</small><b id="mid">1</b></div><div class="b"><small>SCORE</small><b id="sc">0</b></div></div>
<div id="spd"><b id="kmh">0</b><small>KM/H</small><div class="bar"><i id="nit"></i></div><small>NITRO</small></div>
<div id="toast"></div>
<button id="nbtn">NITRO</button>
<div id="menu" class="ov">
<h1>NEON<br>DRIFT</h1>
<p>Pick a mode, a car and a world, then outrun the night. Grab gold rings for points and nitro.</p>
<div id="opts" style="display:flex;flex-direction:column;gap:10px"></div><button class="go" id="start">START ENGINE</button>
<div class="keys"><span><kbd>←</kbd><kbd>→</kbd>Steer</span><span><kbd>↓</kbd>Brake</span><span><kbd>Space</kbd>Nitro</span><span><kbd>M</kbd>Mute</span></div>
<div class="keys" id="best"></div>
</div>
<div id="over" class="ov hide">
<h1 id="ot" style="font-size:clamp(36px,8vw,80px)">TIME’S UP</h1>
<div class="stat" id="fs"></div><p id="fd"></p>
<button class="go" id="again">RACE AGAIN</button><button class="go" id="mn" style="background:none;color:var(--cy);border:1px solid var(--cy);box-shadow:none">CHANGE MODE</button>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
let W,H,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,1.5);W=cv.width=innerWidth*dpr|0;H=cv.height=innerHeight*dpr|0}
addEventListener('resize',rs);rs();
const SEG=200,RW=2200,CAMH=1000,DRAW=140,CD=1/Math.tan(50*Math.PI/180),PZ=CAMH*CD,MAX=12000;
const segs=[];
const ly=()=>segs.length?segs[segs.length-1].p2.w.y:0;
const eo=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+.5);
function add(k,y){const n=segs.length,y0=ly();segs.push({i:n,k,col:(n/3|0)%2,cars:[],cn:[],props:[],cl:0,p1:{w:{x:0,y:y0,z:n*SEG},c:{},s:{}},p2:{w:{x:0,y:y,z:(n+1)*SEG},c:{},s:{}}})}
function road(e,h,l,k,dy){const y0=ly(),y1=y0+dy*SEG,t=e+h+l;
for(let n=0;n<e;n++)add(k*(n/e)**2,eo(y0,y1,n/t));
for(let n=0;n<h;n++)add(k,eo(y0,y1,(e+n)/t));
for(let n=0;n<l;n++)add(k*(1-n/l)**2,eo(y0,y1,(e+h+n)/t))}
road(30,30,30,0,0);
for(let k=0;k<26;k++)road(15+(k*7)%20,20+(k*11)%30,15+(k*5)%20,((k*37)%9-4)*1.1,(k%2?1:-1)*(15+(k*13)%35));
road(40,40,40,0,-ly()/SEG);
const L=segs.length,TL=L*SEG;
segs.forEach(s=>{if(s.i%9===0){const c=(s.i/9|0)%2?'#ff2e88':'#18e0ff';s.props.push({o:-1.3,c},{o:1.3,c})}});
const cols=['#ff2e88','#18e0ff','#ffd23f','#7cff6b','#b36bff','#ff7a2e','#e8e8f4'];
const traffic=[];for(let i=0;i<46;i++)traffic.push({z:(150+Math.random()*(L-150))*SEG,o:[-.66,0,.66][i%3]+(Math.random()-.5)*.12,s:MAX*(.12+Math.random()*.25),c:cols[i%cols.length]});
const stars=Array.from({length:90},()=>[Math.random(),Math.random()]);
const TH=[{n:'Neon Night',sk:['#06010f','#2a0a55','#a8216f','#ff7a59'],sun:['#fff27a','#ff5fa2','#c026d3'],m1:'#1a0638',m2:'#12042a',ml:'#18e0ff',gr:'#3b1163',g1:'#1c0a3d',g2:'#240f4f',r1:'#ff2e88',r2:'#18e0ff',rd:['#2a2a42','#303049']},
{n:'Sunset Canyon',sk:['#1a0b2e','#5a1e4a','#ff6a3d','#ffd166'],sun:['#fff3b0','#ffb347','#ff5e3a'],m1:'#3d1220',m2:'#2a0c18',ml:'#ffb347',gr:'#5a2318',g1:'#6b2c1c',g2:'#7a3622',r1:'#ffffff',r2:'#ff4d2e',rd:['#3a2b33','#42323b']},
{n:'Ice Aurora',sk:['#020b1f','#0b3a5c','#2aa6b8','#bff6ff'],sun:['#ffffff','#bff6ff','#6fd8ff'],m1:'#0c2a44',m2:'#08203a',ml:'#99ffee',gr:'#0e3a5a',g1:'#0f3552',g2:'#124060',r1:'#ffffff',r2:'#18e0ff',rd:['#26364a','#2c3d52']},
{n:'Storm City',rain:1,sk:['#010208','#081433','#2b2a6e','#8a4fa8'],sun:['#c9b8ff','#8a6bff','#4a2bb0'],m1:'#0a0f26',m2:'#070b1c',ml:'#ff2e88',gr:'#101a3a',g1:'#0b1230',g2:'#0e1738',r1:'#18e0ff',r2:'#ff2e88',rd:['#1c2038','#222742']}];
const CARS=[{n:'Viper',c:'#e11d48',acc:1,top:1,str:1},{n:'Phantom',c:'#18e0ff',acc:.9,top:1.12,str:.85},{n:'Drift King',c:'#ffd23f',acc:1.1,top:.96,str:1.3}];
const MH=['60s on the clock, +25s every lap','3 lives, no clock, traffic speeds up each lap','3 laps, fastest time wins'];
const coins=[];for(let i=0;i<32;i++){const z=(120+i*(L-160)/32)*SEG,o=[-.66,0,.66][(i*7)%3];for(let j=0;j<5;j++)coins.push({z:z+j*SEG*3,o,g:0})}
let st='menu',pos=0,pX=0,speed=0,time=60,score=0,lap=0,shake=0,nit=100,steer=0,flash=0,bgx=0,best=0,bst=false,mute=false,mode=0,lives=3,cdt=0,cdn=4,bolt=0,th=TH[0],cr=CARS[0],bests=[0,0,0];
try{bests=JSON.parse(localStorage.getItem('nd_b2'))||bests}catch(e){}
function showBest(){const b=bests[mode];$('best').textContent=b?(mode===2?'Best time: '+b.toFixed(1)+'s':'Best score: '+b):'';$('mh').textContent=MH[mode]}
function row(lab,items,get,set){const d=document.createElement('div');d.className='row';d.append(lab+' ');const bs=items.map((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{set(i);bs.forEach((x,j)=>x.classList.toggle('on',j===i));showBest()};b.classList.toggle('on',i===get());d.append(b);return b});$('opts').append(d)}
row('MODE',['Classic','Endless','Time Trial'],()=>mode,i=>mode=i);
row('CAR',CARS.map(c=>c.n),()=>CARS.indexOf(cr),i=>cr=CARS[i]);
row('WORLD',TH.map(t=>t.n),()=>TH.indexOf(th),i=>th=TH[i]);
{const m=document.createElement('div');m.className='row';m.id='mh';$('opts').append(m)}
showBest();
const keys={l:0,r:0,b:0,n:0},parts=[];
const km={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowDown:'b',s:'b',' ':'n',Shift:'n'};
addEventListener('keydown',e=>{const k=km[e.key.length>1?e.key:e.key.toLowerCase()];if(k){keys[k]=1;e.preventDefault()}
if(e.key==='m')mute=!mute;if(e.key==='Enter'){if(st==='menu')start();else if(st==='over'&&overT>.8)start()}});
addEventListener('keyup',e=>{const k=km[e.key.length>1?e.key:e.key.toLowerCase()];if(k)keys[k]=0});
function tp(e){const t=[...e.touches];keys.l=+t.some(o=>o.clientX<innerWidth/2);keys.r=+t.some(o=>o.clientX>=innerWidth/2)}
['touchstart','touchmove','touchend','touchcancel'].forEach(v=>cv.addEventListener(v,e=>{e.preventDefault();tp(e)},{passive:false}));
const nb=$('nbtn');nb.addEventListener('pointerdown',()=>keys.n=1);['pointerup','pointerleave','pointercancel'].forEach(v=>nb.addEventListener(v,()=>keys.n=0));
$('start').onclick=start;$('again').onclick=start;$('mn').onclick=()=>{st='menu';$('over').classList.add('hide');$('menu').classList.remove('hide');document.body.classList.add('m')};
let ac,osc,gn;
function aud(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';gn=ac.createGain();gn.gain.value=0;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=650;osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start()}catch(e){}}
let tt;function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,1500)}
let overT=0;
function start(){aud();if(ac&&ac.state==='suspended')ac.resume();st='play';pos=0;pX=0;speed=0;time=mode===0?60:0;score=0;lap=0;nit=100;lives=3;cdt=3;cdn=4;coins.forEach(c=>c.g=0);$('tl').textContent=mode===0?'TIME':'ELAPSED';$('ml').textContent=mode===1?'LIVES':'LAP';
traffic.forEach(c=>{if(c.z<SEG*60)c.z+=SEG*80});
$('menu').classList.add('hide');$('over').classList.add('hide');document.body.classList.remove('m')}
function over(){st='over';overT=0;const sc=Math.floor(score);let o='TIME’S UP',t='Score '+sc;
if(mode===1)o='CRASHED OUT';
if(mode===2){o='FINISHED';t='Time '+time.toFixed(1)+'s';if(!bests[2]||time<bests[2])bests[2]=time}else if(sc>bests[mode])bests[mode]=sc;
try{localStorage.setItem('nd_b2',JSON.stringify(bests))}catch(e){}
$('ot').textContent=o;$('fs').textContent=t;$('fd').textContent=lap+' laps · score '+sc;showBest();$('over').classList.remove('hide')}
function spark(n,c,x,y){for(let i=0;i<n;i++)parts.push({x:x??W/2,y:y??H*.88,vx:(Math.random()-.5)*600*dpr,vy:-Math.random()*500*dpr,l:.5+Math.random()*.4,c})}
function upd(dt){
const sp=speed/MAX,ps=segs[((pos+PZ)/SEG|0)%L];
traffic.forEach(c=>c.z=(c.z+c.s*(mode===1?1+lap*.08:1)*dt)%TL);
shake=Math.max(0,shake-dt*2.5);flash=Math.max(0,flash-dt*2);
if(st==='play'){
if(cdt>0){cdt-=dt;const n=Math.ceil(cdt);if(n!==cdn){cdn=n;toast(n>0?n:'GO!')}if(cdt>0){bst=false;steer=0;return}}
bst=!!keys.n&&nit>0&&sp>.05;
steer=keys.r-keys.l;pX+=steer*dt*2.4*cr.str*sp;pX-=dt*2*sp*sp*ps.k*.25;
speed+=(keys.b?-MAX*1.1:MAX/4.5*cr.acc*(bst?2.6:1))*dt;
if(!bst&&speed>MAX*cr.top)speed-=MAX*.7*dt;
if(Math.abs(pX)>1.05&&speed>MAX/4){speed-=MAX/2*dt;shake=Math.max(shake,.25);if(Math.random()<.5)spark(1,'#9b7bff')}
speed=Math.max(0,Math.min(MAX*1.4*cr.top,speed));
pX=Math.max(-2.4,Math.min(2.4,pX));
nit=bst?Math.max(0,nit-32*dt):Math.min(100,nit+7*dt);
for(const c of traffic){const dz=(c.z-(pos+PZ)+TL)%TL;
if(dz<SEG*1.3&&Math.abs(c.o-pX)<.26&&speed>c.s){speed=c.s*.55;shake=1;flash=.6;spark(28,'#ffb347');c.z+=SEG*4;pX+=(pX>c.o?1:-1)*.15;if(mode===1&&--lives<=0){over();return}}}
for(const c of coins){if(c.g)continue;const dz=(c.z-(pos+PZ)+TL)%TL;if(dz<SEG*1.5&&Math.abs(c.o-pX)<.3){c.g=1;score+=100;nit=Math.min(100,nit+8);spark(6,'#ffe66d')}}
pos+=speed*dt;if(pos>=TL){pos-=TL;lap++;coins.forEach(c=>c.g=0);if(mode===0){time+=25;toast('CHECKPOINT +25s')}else if(mode===2){if(lap>=3){over();return}toast('LAP '+(lap+1)+' / 3')}else toast('LAP '+(lap+1))}
if(mode===0){time-=dt;if(time<=0){time=0;over();return}}else time+=dt;
score+=speed*dt/90;
if(bst&&Math.random()<.8){spark(1,'#6fd8ff',W/2-W*.06,H*.93);spark(1,'#6fd8ff',W/2+W*.06,H*.93)}
}else{
const a=st==='menu';speed=a?MAX*.55:Math.max(0,speed-MAX*.5*dt);
if(a)pX=Math.sin(performance.now()/2500)*.55;steer=0;bst=false;pos=(pos+speed*dt)%TL;overT+=dt}
bgx+=ps.k*(speed/MAX)*dt*.9;
if(osc){osc.frequency.value=45+sp*190+(bst?45:0);gn.gain.value=(mute||st!=='play')?0:.05}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dpr*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
$('t').textContent=mode===0?Math.ceil(time):time.toFixed(1);$('sc').textContent=Math.floor(score);$('kmh').textContent=Math.round(sp*280);$('nit').style.width=nit+'%';$('mid').textContent=mode===1?'♥'.repeat(lives):mode===2?Math.min(lap+1,3)+'/3':lap+1}
function pr(p,cx,cy,cz){const c=p.c,s=p.s;c.x=p.w.x-cx;c.y=p.w.y-cy;c.z=p.w.z-cz;s.sc=CD/c.z;s.x=Math.round(W/2+s.sc*c.x*W/2);s.y=Math.round(H/2-s.sc*c.y*H/2);s.w=Math.round(s.sc*RW*W/2)}
function pl(x1,y1,x2,y2,x3,y3,x4,y4,c){g.fillStyle=c;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.lineTo(x4,y4);g.closePath();g.fill()}
function mt(off,amp,f,col,line){const hz=H/2;g.beginPath();g.moveTo(0,hz+2);
for(let x=0;x<=W+14;x+=12*dpr){const u=(x+off)*f;g.lineTo(x,hz-amp*(1-Math.abs(Math.sin(u)))*(.5+.5*Math.sin(u*.31+1)))}
g.lineTo(W+14,hz+2);g.closePath();g.fillStyle=col;g.fill();if(line){g.strokeStyle=line;g.lineWidth=2*dpr;g.stroke()}}
function city(){const hz=H/2,bw=34*dpr,off=bgx*W*.2,m=((off%bw)+bw)%bw,k0=Math.floor(off/bw);
for(let i=0;i<Math.ceil(W/bw)+2;i++){const k=k0+i,r=Math.abs(Math.sin(k*12.9898)*43758.5453)%1,bh=H*(.03+r*.1),x=i*bw-m;
g.fillStyle=th.m2;g.fillRect(x,hz-bh,bw-2*dpr,bh);
if(r>.4){g.fillStyle=th.ml;g.globalAlpha=.55;for(let y=hz-bh+6*dpr,j=0;y<hz-4*dpr;y+=9*dpr,j++)if((k*7+j)%3===0)g.fillRect(x+5*dpr,y,3*dpr,3*dpr);g.globalAlpha=1}}}
function sky(t){const hz=H/2;
let gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,th.sk[0]);gr.addColorStop(.55,th.sk[1]);gr.addColorStop(.85,th.sk[2]);gr.addColorStop(1,th.sk[3]);
g.fillStyle=gr;g.fillRect(0,0,W,hz+2);
stars.forEach((s,i)=>{g.fillStyle=`rgba(255,255,255,${.25+.6*Math.abs(Math.sin(t*2+i))})`;g.fillRect(((s[0]*W-bgx*W*.01)%W+W)%W,s[1]*hz*.7,2*dpr,2*dpr)});
const r=H*.15,cx=W*.5,cy=hz-r*.3;
const gl=g.createRadialGradient(cx,cy,r*.5,cx,cy,r*2.6);gl.addColorStop(0,'rgba(255,60,150,.55)');gl.addColorStop(1,'rgba(255,60,150,0)');g.fillStyle=gl;g.fillRect(0,0,W,hz);
const gs=g.createLinearGradient(0,cy-r,0,cy+r);gs.addColorStop(0,th.sun[0]);gs.addColorStop(.55,th.sun[1]);gs.addColorStop(1,th.sun[2]);g.fillStyle=gs;
for(let j=0;j<20;j++){if(j>8&&j%2)continue;const y0=-r+j*r/10,yy=cy+y0;if(yy>=hz)break;const m=y0+r/20,hw=Math.sqrt(Math.max(0,r*r-m*m));g.fillRect(cx-hw,yy,hw*2,r/10)}
mt(bgx*W*.05,H*.14,.006/dpr,th.m1);mt(bgx*W*.14,H*.09,.011/dpr+.002,th.m2,th.ml);city();
g.fillStyle=th.gr;g.fillRect(0,hz,W,hz)}
function car(x,y,w,col,pl,br){const h=w*.5;g.save();g.translate(x,y);
g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.ellipse(0,0,w*.56,h*.14,0,0,7);g.fill();
g.fillStyle='#050509';g.fillRect(-w*.5,-h*.42,w*.15,h*.42);g.fillRect(w*.35,-h*.42,w*.15,h*.42);
g.fillStyle=col;g.beginPath();g.roundRect(-w*.5,-h*.7,w,h*.52,w*.07);g.fill();
